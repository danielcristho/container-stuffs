version: '3.8'
services:
  vnc_firefox:
    build: .
    container_name: vnc_firefox
    ports:
      - "5901:5900"
      - "6080:6080"
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q 6080 || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
