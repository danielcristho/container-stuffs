version: '3.8'

services:
  master:
    build: ./master
    container_name: postgres_master
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - master_data:/var/lib/postgresql/data
      - ./master/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./master/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./master/pg_hba.conf:/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      postgres_net:
        ipv4_address: 10.0.2.10

  slave:
    build: ./slave
    container_name: postgres_slave
    restart: unless-stopped
    command: ["bash", "-c", "sleep infinity"]
    ports:
      - "5434:5432"
    volumes:
      - slave_data:/var/lib/postgresql/data
      - ./slave/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./slave/pg_hba.conf:/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    networks:
      postgres_net:
        ipv4_address: 10.0.2.11

networks:
  postgres_net:
    ipam:
      config:
        - subnet: 10.0.2.0/24

volumes:
  master_data:
  slave_data:
